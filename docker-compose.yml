services:

  postgres:
    image: postgres:16
    container_name: bigdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_transportation}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bigdata} -d ${POSTGRES_DB:-smart_transportation}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: bigdata-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-smart_transportation}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bigdata-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: bigdata-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  tlc-producer:
    build:
      context: .
      dockerfile: kafka/docker/Dockerfile
    container_name: bigdata-tlc-producer
    restart: "no"
    profiles:
      - producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TLC_TOPIC: tlc-trips
      TLC_PROCESSED_PATH: hdfs://namenode:9000/data/smart_transportation/processed/tlc/
    depends_on:
      - kafka
      - namenode

  namenode:
    image: apache/hadoop:3.4.1
    container_name: bigdata-namenode
    hostname: namenode
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
      - ./hdfs/configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: >
      bash -c "
      if [ ! -d /tmp/hadoop-hadoop/dfs/name/current ]; then
        hdfs namenode -format -force -nonInteractive;
      fi &&
      hdfs namenode
      "

  datanode:
    image: apache/hadoop:3.4.1
    container_name: bigdata-datanode
    hostname: datanode
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
      - ./hdfs/configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      - namenode
    command: hdfs datanode

  spark:
    image: apache/spark:4.0.0
    container_name: bigdata-spark
    command:
      - bash
      - -c
      - ' /opt/spark/sbin/start-master.sh && tail -f /dev/null '
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./spark:/opt/spark/work-dir/spark
    ports:
      - "8080:8080"
      - "7077:7077"

  hive-metastore:
    build:
      context: ./hive
      dockerfile: docker/Dockerfile
    container_name: bigdata-hive-metastore
    restart: unless-stopped

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=bigdata
        -Djavax.jdo.option.ConnectionPassword=bigdata

    volumes:
      - ./hdfs/configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    ports:
      - "9083:9083"

    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started

  hive-server:
    build:
      context: ./hive
      dockerfile: docker/Dockerfile
    container_name: bigdata-hive-server
    restart: unless-stopped
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_SERVER2_THRIFT_BIND_HOST: 0.0.0.0
      HIVE_SERVER2_THRIFT_PORT: 10000
      HIVE_SERVER2_TRANSPORT_MODE: binary
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    entrypoint: >
      bash -c "rm -f /opt/hive/conf/*.pid && exec /entrypoint.sh"
    volumes:
      - ./hdfs/configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: bigdata-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: bigdata-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  namenode_data:
  datanode_data:
  hive_warehouse:
  grafana_data: